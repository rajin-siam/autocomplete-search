services:

  nominatim:
    image: mediagis/nominatim:4.4
    shm_size: 2g
    environment:
      - PBF_PATH=/nominatim/data/bangladesh-latest.osm.pbf
      - THREADS=4
      - NOMINATIM_PASSWORD=${NOMINATIM_PASSWORD}
    volumes:
      - ./bangladesh-latest.osm.pbf:/nominatim/data/bangladesh-latest.osm.pbf
      - nominatim-postgres-data:/var/lib/postgresql/14/main
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominatim"]
      interval: 15s
      timeout: 5s
      retries: 40

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    depends_on:
      nominatim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  indexer:
    build: .
    command: ["./place-search", "index"]
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=places
      - DATABASE_HOST=nominatim
      - DATABASE_PORT=5432
      - DATABASE_NAME=nominatim
      - DATABASE_USER=nominatim
      - DATABASE_PASSWORD=${NOMINATIM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    command: ["./place-search", "serve"]
    ports:
      - "2322:2322"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=places
      - SERVER_PORT=2322
      - SEARCH_MIN_CHARS=2
      - SEARCH_FUZZINESS=AUTO
      - SEARCH_MAX_RESULTS=15
    depends_on:
      indexer:
        condition: service_completed_successfully

volumes:
  es-data:
  nominatim-postgres-data:
